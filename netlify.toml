[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://www.hijamaandmore.com/*"
  to = "https://hijamaandmore.com/:splat"
  status = 301
  force = true

# NOTE: no catch-all `/* -> /index.html` rule here. Routing is handled by
# @netlify/plugin-nextjs; a SPA-style catch-all would shadow the App Router's
# dynamic routes (e.g. /services/[slug]).
