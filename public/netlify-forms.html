<!DOCTYPE html>
<html>
<head><title>Netlify Form Definitions</title></head>
<body>

  <!--
    Netlify detects forms at build time by parsing static HTML. The React
    forms are client-rendered, so each one is declared here as well.
    Field names must match src/lib/form-fields.ts.

    Notifications (so a request reaches the practitioner by text and email)
    are configured in the Netlify UI:
      Site settings → Forms → Form notifications
        · Email notification  → the practitioner's inbox
        · Outgoing webhook    → an SMS service (e.g. Twilio) for the text
  -->

  <!-- appointment-request form -->
  <form name="appointment-request" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="appointment-request" />
    <input name="bot-field" />
    <input name="name" type="text" />
    <input name="phone" type="tel" />
    <input name="email" type="email" />
    <input name="service" type="text" />
    <input name="cups" type="text" />
    <input name="contact-method" type="text" />
    <input name="preferred-days" type="text" />
    <input name="student" type="text" />
    <textarea name="notes"></textarea>
    <button type="submit">Submit</button>
  </form>

  <!-- contact form -->
  <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" type="text" />
    <input name="email" type="email" />
    <textarea name="message"></textarea>
    <button type="submit">Submit</button>
  </form>

  <!-- notify-me form -->
  <form name="notify-me" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="notify-me" />
    <input name="bot-field" />
    <input name="email" type="email" />
    <button type="submit">Submit</button>
  </form>

</body>
</html>
